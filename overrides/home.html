{% extends "main.html" %}

{% block header %}
<style>.cdut-cover{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px;background:linear-gradient(120deg,#f0fbff,#f1fcf4);color:#294562}.cdut-cover__inner{width:100%;max-width:760px}.cdut-cover__emblem{display:block;width:clamp(145px,22vw,220px);height:auto;margin:0 auto 24px;border-radius:50%}.cdut-cover__university{font-size:22px;letter-spacing:.25em;margin:0 0 14px}.cdut-cover h1{font-size:clamp(25px,4vw,36px);font-weight:500;line-height:1.5;margin:0 0 18px}.cdut-cover__english{font-size:18px;letter-spacing:.05em;margin:0 0 16px}.cdut-cover__description{font-size:16px;margin:0 0 30px}.cdut-cover__actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.cdut-cover__actions a{display:inline-block;border-radius:30px;padding:12px 30px;font-size:16px}.cdut-cover__read{background:#3bb58c;color:#fff!important}.cdut-cover__github{border:1px solid #3bb58c;color:#237d65!important}.cdut-cover__note{font-size:12px;margin-top:28px;opacity:.75}</style>
<section class="cdut-cover" aria-labelledby="cover-title">
  <div class="cdut-cover__inner">
    <img class="cdut-cover__emblem" src="{{ 'assets/cdut-emblem.png' | url }}" alt="成都理工大学校徽" width="220" height="220">
    <p class="cdut-cover__university">成都理工大学</p>
    <h1 id="cover-title">成都理工大学飞跃手册</h1>
    <p class="cdut-cover__english">CDUT Application Wiki</p>
    <p class="cdut-cover__description">记录不同的选择，分享真实的经历。</p>
    <div class="cdut-cover__actions">
      <a class="cdut-cover__read" href="#handbook-content">进入阅读</a>
      <a class="cdut-cover__github" href="{{ config.repo_url }}">GitHub</a>
    </div>
    <p class="cdut-cover__note">学生共建 · 非学校官方文件</p>
  </div>
</section>
<div id="handbook-content" class="cdut-content-anchor"></div>
{{ super() }}
{% endblock %}
